<table mat-table [dataSource]="datasource()!" class="mat-elevation-z8">
  <!--- Note that these columns can be defined in any order.
        The actual rendered columns are set as a property on the row definition" -->

  <!-- Position Column -->
  @if(allApplicants() === false){
  <ng-container matColumnDef="select">
    <th mat-header-cell *matHeaderCellDef>
      <mat-checkbox
        color="primary"
        (change)="$event ? toggleAllRows() : null"
        [checked]="selection.hasValue() && isAllSelected()"
        [indeterminate]="selection.hasValue() && !isAllSelected()"
        (change)="handleSelectedApplicants()"

      >
      </mat-checkbox>
    </th>
    <td mat-cell *matCellDef="let row">
      <mat-checkbox
        color="primary"
        (click)="$event.stopPropagation()"
        (change)="$event ? selection.toggle(row) : null"
        [checked]="selection.isSelected(row)"
        (change)="handleSelectedApplicants()"

      >
      </mat-checkbox>
    </td>
  </ng-container>
  }
  <ng-container matColumnDef="firstName">
    <th mat-header-cell *matHeaderCellDef>First Name</th>
    <td mat-cell *matCellDef="let applicant">{{ applicant.firstName }}</td>
  </ng-container>

  <ng-container matColumnDef="lastName">
    <th mat-header-cell *matHeaderCellDef>Last Name</th>
    <td mat-cell *matCellDef="let applicant">{{ applicant.lastName }}</td>
  </ng-container>

  <ng-container matColumnDef="email">
    <th mat-header-cell *matHeaderCellDef>Email</th>
    <td mat-cell *matCellDef="let applicant">{{ applicant.email }}</td>
  </ng-container>

  <!-- Symbol Column -->
  @if (allApplicants() ===false) {
  <ng-container matColumnDef="appliedOn">
    <th mat-header-cell *matHeaderCellDef>AppliedOn</th>
    <td mat-cell *matCellDef="let applicant">
      {{ applicant.appliedOn | date }}
    </td>
  </ng-container>
  } @if(allApplicants()===true){
  <ng-container matColumnDef="city">
    <th mat-header-cell *matHeaderCellDef>City</th>
    <td mat-cell *matCellDef="let applicant">{{ applicant.city }}</td>
  </ng-container>
  }

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>
